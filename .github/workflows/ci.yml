name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Node 26 — Prettier, ESLint, Vitest & Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'npm'
          cache-dependency-path: 'backend/package-lock.json'

      - name: Install backend dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Run ESLint
        run: npm run lint

      - name: Run Vitest with >= 80% coverage gate
        run: npm run test:ci

      - name: Build TypeScript output
        run: npm run build

  frontend:
    name: Frontend (Angular 22 — Prettier, ESLint, Vitest & Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install frontend dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Run ESLint
        run: npm run lint

      - name: Run headless Vitest with >= 80% coverage gate
        run: npm run test:ci

      - name: Build Angular production bundle
        run: npm run build

  docker-smoke:
    name: Container Build & Live Marktplatz Smoke Scrape
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    continue-on-error: ${{ github.event_name == 'pull_request' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build container image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: willhaben-hunter-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run in-container smoke scrape (limit 3, skipDetails)
        run: docker run --rm --init --shm-size=256m willhaben-hunter-web:ci node dist/smoke.js
